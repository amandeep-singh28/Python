<h2>Student List</h2>

<a href="{% url 'student_add' %}">Add Student</a>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>Course</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{student.name}}</td>
        <td>{{student.email}}</td>
        <td>{{student.age}}</td>
        <td>{{student.course}}</td>
        <td>
            <a href="{% url 'student_update' student.id %}">Update</a>
        </td>
        <td>
            <a href="{% url 'student_delete' student.id %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
