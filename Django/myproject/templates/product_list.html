<h2>Product List</h2>

<a href="{% url 'add_product' %}">Add Product</a>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Quantity</th>
        <th>Update</th>
    </tr>

    {% for product in products %}
    <tr>
        <td>{{ product.name }}</td>
        <td>{{ product.quantity }}</td>
        <td>
            <a href="{% url 'update_stock' product.pk %}">Update</a>
        </td>
    </tr>
    {% endfor %}
</table>
