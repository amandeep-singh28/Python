<!doctype html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-bs-theme="dark">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">Blogger</a>

    <div class="ms-auto">
        <a href="/create" class="btn btn-success me-2">Create Blog</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</nav>

<div class="container mt-4">

    {% for blog in blogs %}
        <div class="card mb-3">
            <div class="card-body">
                <h3>{{ blog.title }}</h3>
                <p>{{ blog.content }}</p>
                <small>By {{ blog.author.username }}</small>
                <br><br>

                {% if blog.user_id == session['user_id'] %}
                    <a href="/edit/{{ blog.id }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="/delete/{{ blog.id }}" class="btn btn-danger btn-sm">Delete</a>
                {% endif %}
            </div>
        </div>
    {% endfor %}

</div>
</body>
</html>
