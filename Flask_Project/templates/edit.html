<!doctype html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-bs-theme="dark">
<div class="container mt-5">
    <h2>Edit Blog</h2>

    <form method="POST">
        <input type="text" name="title" value="{{ blog.title }}" class="form-control mb-3" required>
        <textarea name="content" class="form-control mb-3" required>{{ blog.content }}</textarea>
        <button class="btn btn-warning">Update</button>
    </form>
</div>
</body>
</html>
