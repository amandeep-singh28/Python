<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h2>Enter Details</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label for="username">Name</label> <br>
        <input type="text" name = "username" placeholder="Enter your name" value="{{ request.form.username }}"> <br><br>

        <label for="age">Age</label> <br>
        <input type="text" name="age" placeholder="Enter your age" value="{{request.form.age}}"> <br><br>

        <input type="submit" name="submit">
    </form>
</body>
</html>
