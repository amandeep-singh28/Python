<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Students Data</h2>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
        </tr>
        {% for student in student %}
        <tr>
            <td>{{student.sno}}</td>
            <td>{{student.username}}</td>
            <td>{{student.age}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
